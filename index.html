<!-- Gráfico Boxplot SVG Fiel ao ggplot2 -->
    <div class="chart-box">
      <svg viewBox="0 0 900 480" style="width: 100%; height: auto; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <!-- Título do Gráfico -->
        <text x="45" y="32" font-size="17" font-weight="600" fill="#1e293b">Distribuição do número de páginas por prateleira</text>

        <!-- Grade de Fundo (theme_minimal) -->
        <line x1="80" y1="410" x2="730" y2="410" stroke="#f1f5f9" stroke-width="1.2" />
        <line x1="80" y1="322.5" x2="730" y2="322.5" stroke="#f1f5f9" stroke-width="1.2" />
        <line x1="80" y1="235" x2="730" y2="235" stroke="#f1f5f9" stroke-width="1.2" />
        <line x1="80" y1="147.5" x2="730" y2="147.5" stroke="#f1f5f9" stroke-width="1.2" />
        <line x1="80" y1="60" x2="730" y2="60" stroke="#f1f5f9" stroke-width="1.2" />

        <!-- Rótulos do Eixo Y -->
        <text x="68" y="326" font-size="12" fill="#64748b" text-anchor="end">200</text>
        <text x="68" y="239" font-size="12" fill="#64748b" text-anchor="end">400</text>
        <text x="68" y="151" font-size="12" fill="#64748b" text-anchor="end">600</text>
        <text x="68" y="64" font-size="12" fill="#64748b" text-anchor="end">800</text>

        <!-- Título do Eixo Y (Rotacionado) -->
        <text x="-235" y="24" font-size="13" font-weight="500" fill="#334155" text-anchor="middle" transform="rotate(-90)">Número de páginas</text>

        <!-- ==================== PRATELEIRA 1 ==================== -->
        <!-- Bigode e limites (mín = 120, máx = 287) -->
        <line x1="200" y1="355.7" x2="200" y2="357.5" stroke="#334155" stroke-width="1.5" />
        <!-- Caixa Boxplot (Q1=124, Mediana=124, Q3=164.75) -->
        <rect x="130" y="337.9" width="140" height="17.8" fill="#66c2a5" fill-opacity="0.75" stroke="#1e293b" stroke-width="1.5" rx="1" />
        <!-- Linha da Mediana (y = 124 -> 355.7px) -->
        <line x1="130" y1="355.7" x2="270" y2="355.7" stroke="#0f172a" stroke-width="2.5" />

        <!-- Pontos Jitter P1 (exatamente como na imagem) -->
        <!-- Pontos em 124 e 120 -->
        <circle cx="163" cy="355.7" r="4" fill="#1e293b" opacity="0.8" />
        <circle cx="178" cy="355.7" r="4" fill="#1e293b" opacity="0.8" />
        <circle cx="190" cy="357.5" r="4" fill="#1e293b" opacity="0.8" />
        <circle cx="202" cy="355.7" r="4" fill="#1e293b" opacity="0.8" />
        <circle cx="216" cy="355.7" r="4" fill="#1e293b" opacity="0.8" />
        <circle cx="225" cy="355.7" r="4" fill="#1e293b" opacity="0.8" />
        <!-- Dois pontos em 287 -->
        <circle cx="171" cy="284.4" r="4" fill="#1e293b" opacity="0.8" />
        <circle cx="184" cy="284.4" r="4" fill="#1e293b" opacity="0.8" />

        <!-- Rótulo Eixo X P1 -->
        <text x="200" y="435" font-size="12.5" fill="#334155" text-anchor="middle">Prateleira 1</text>

        <!-- ==================== PRATELEIRA 2 ==================== -->
        <!-- Bigode inferior (até 308) e superior (até 802) -->
        <line x1="420" y1="128.6" x2="420" y2="59.1" stroke="#334155" stroke-width="1.5" />
        <line x1="420" y1="229.4" x2="420" y2="275.3" stroke="#334155" stroke-width="1.5" />
        <!-- Caixa Boxplot (Q1=418.5, Mediana=487, Q3=644) -->
        <rect x="350" y="128.6" width="140" height="100.8" fill="#fc8d62" fill-opacity="0.75" stroke="#1e293b" stroke-width="1.5" rx="1" />
        <!-- Linha da Mediana (y = 487 -> 197.1px) -->
        <line x1="350" y1="197.1" x2="490" y2="197.1" stroke="#0f172a" stroke-width="2.5" />

        <!-- Pontos Jitter P2 (exatamente como na imagem) -->
        <!-- Ponto extremo superior (802) -->
        <circle cx="431" cy="59.1" r="4" fill="#1e293b" opacity="0.8" />
        <!-- Dois pontos em 644 -->
        <circle cx="396" cy="128.6" r="4" fill="#1e293b" opacity="0.8" />
        <circle cx="406" cy="128.6" r="4" fill="#1e293b" opacity="0.8" />
        <!-- Dois pontos centrais (487 e 447) -->
        <circle cx="395" cy="197.1" r="4" fill="#1e293b" opacity="0.8" />
        <circle cx="458" cy="197.1" r="4" fill="#1e293b" opacity="0.8" />
        <circle cx="463" cy="214.6" r="4" fill="#1e293b" opacity="0.8" />
        <!-- Dois pontos inferiores (333 e 308) -->
        <circle cx="363" cy="264.3" r="4" fill="#1e293b" opacity="0.8" />
        <circle cx="403" cy="275.3" r="4" fill="#1e293b" opacity="0.8" />

        <!-- Rótulo Eixo X P2 -->
        <text x="420" y="435" font-size="12.5" fill="#334155" text-anchor="middle">Prateleira 2</text>

        <!-- ==================== PRATELEIRA 3 ==================== -->
        <!-- Bigode inferior (até 311) -->
        <line x1="640" y1="225" x2="640" y2="273.9" stroke="#334155" stroke-width="1.5" />
        <!-- Caixa Boxplot Achatada (Q1=423.25, Mediana=430, Q3=430) -->
        <rect x="570" y="222.0" width="140" height="3.5" fill="#8da0cb" fill-opacity="0.75" stroke="#1e293b" stroke-width="1.5" rx="1" />
        <!-- Linha da Mediana (y = 430 -> 222.0px) -->
        <line x1="570" y1="222.0" x2="710" y2="222.0" stroke="#0f172a" stroke-width="2.5" />

        <!-- Pontos Jitter P3 (exatamente como na imagem) -->
        <!-- Pontos agrupados na linha dos 430 e 428 -->
        <circle cx="616" cy="222.0" r="4" fill="#1e293b" opacity="0.8" />
        <circle cx="625" cy="222.0" r="4" fill="#1e293b" opacity="0.8" />
        <circle cx="633" cy="222.0" r="4" fill="#1e293b" opacity="0.8" />
        <circle cx="646" cy="222.0" r="4" fill="#1e293b" opacity="0.8" />
        <circle cx="658" cy="222.0" r="4" fill="#1e293b" opacity="0.8" />
        <!-- Ponto intermediário (409) -->
        <circle cx="650" cy="231.2" r="4" fill="#1e293b" opacity="0.8" />
        <!-- Ponto inferior isolado (311) -->
        <circle cx="652" cy="273.9" r="4" fill="#1e293b" opacity="0.8" />
        <!-- Ponto em 311/428 repetido conforme dispersão real -->
        <circle cx="682" cy="231.5" r="4" fill="#1e293b" opacity="0.8" />

        <!-- Rótulo Eixo X P3 -->
        <text x="640" y="435" font-size="12.5" fill="#334155" text-anchor="middle">Prateleira 3</text>

        <!-- Título do Eixo X -->
        <text x="420" y="465" font-size="13.5" font-weight="500" fill="#1e293b" text-anchor="middle">Prateleira de Estatística</text>

        <!-- ==================== LEGENDA LATERAL ==================== -->
        <g transform="translate(760, 200)">
          <text x="0" y="0" font-size="13" font-weight="600" fill="#1e293b">prateleira</text>
          
          <!-- Item Prateleira 1 -->
          <circle cx="8" cy="22" r="4" fill="#1e293b" />
          <text x="22" y="26" font-size="12" fill="#334155">Prateleira 1</text>
          
          <!-- Item Prateleira 2 -->
          <circle cx="8" cy="42" r="4" fill="#1e293b" />
          <text x="22" y="46" font-size="12" fill="#334155">Prateleira 2</text>
          
          <!-- Item Prateleira 3 -->
          <circle cx="8" cy="62" r="4" fill="#1e293b" />
          <text x="22" y="66" font-size="12" fill="#334155">Prateleira 3</text>
        </g>
      </svg>
    </div>
